<title>Normales como tú | Redes oficiales</title>
<style>
:root{color-scheme:dark;--bg:#101010;--card:#1d1d1d;--text:#f7f7f7;--muted:#b7b7b7;--accent:#f4c95d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(circle at top,#34302a 0,#171717 38%,#101010 75%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{width:min(100%,440px);text-align:center}.mark{width:92px;height:92px;margin:0 auto 18px;border-radius:28px;display:grid;place-items:center;background:var(--accent);color:#171717;font-size:29px;font-weight:900;letter-spacing:-2px;box-shadow:0 10px 35px #0008}
h1{margin:0;font-size:clamp(27px,7vw,36px);letter-spacing:-1.2px}.tagline{color:var(--muted);margin:10px 0 28px;font-size:15px}
.links{display:grid;gap:13px}a{min-height:60px;padding:0 19px;display:flex;align-items:center;gap:14px;border:1px solid #ffffff20;border-radius:16px;background:var(--card);color:var(--text);text-decoration:none;font-weight:700;font-size:16px;transition:transform .15s,border-color .15s}
a:hover{transform:translateY(-2px);border-color:var(--accent)}.icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;font-size:17px;font-weight:900}
.ig{background:#e1306c}.fb{background:#1877f2}.yt{background:#ff0033}.tt{background:#080808;border:1px solid #444}.arrow{margin-left:auto;color:var(--accent);font-size:20px}footer{color:#858585;font-size:12px;margin-top:28px}
.brand-logo{display:block;width:100%;max-width:380px;height:auto;object-fit:contain;background:#e9e0f0;border-radius:16px;padding:12px;margin:0 auto 22px;box-shadow:none}
</style></head><body><main>
<img src="logo.png" alt="Logo de Normales como tú" class="brand-logo">

</nav><footer>Normales como tú · Redes oficiales</footer>
</main></body></html>
